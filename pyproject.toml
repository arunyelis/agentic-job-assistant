[project]
name = "agentic-job-assistant"
version = "1.0.0"
description = "A private career workspace with application capture and asynchronous agent workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.0,<2",
  "cryptography>=50.0.0,<51",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.0,<1",
  "openai-agents>=0.2.0,<1",
  "psycopg[binary]>=3.2.0,<4",
  "pypdf>=6.15.0,<7",
  "python-docx>=1.2.0,<2",
  "python-dotenv>=1.1.0,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.0,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "pip-audit>=2.9.0,<3",
  "pytest>=8.4.0,<10",
  "pytest-asyncio>=1.1.0,<2",
  "ruff>=0.14.0,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
